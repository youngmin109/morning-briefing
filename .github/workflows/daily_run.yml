name: Daily IT News Automation

on:
  schedule:
    # GitHub Actions의 cron은 UTC 기준입니다.
    # 매일 아침 KST 07:00경 실행 (정각 :00은 GitHub 전역 큐 병목으로 드롭 위험이 크므로 비정각 + 2차 백업 구성)
    - cron: '7 22 * * *'   # 1차: KST 07:07 (UTC 22:07)
    - cron: '37 22 * * *'  # 2차 백업: KST 07:37 (UTC 22:37) - 1차 성공 시 당일 중복 실행 방지로 자동 pass
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화
    inputs:
      force:
        description: '당일 브리핑이 이미 있어도 강제 재실행'
        required: false
        type: boolean
        default: true

concurrency:
  group: daily-news-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # 수집 데이터를 저장소에 커밋하기 위해 필요

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 필수 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 파이프라인 실행 (수집 → 분석 → 전달)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "false" ]; then
            python -m src.main --force
          else
            python -m src.main
          fi

      - name: 수집 데이터 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d) 모닝 브리핑"
            git push
          fi

      - name: 대시보드 사이트 구성 (_site)
        run: |
          mkdir -p _site/data
          cp dashboard/* _site/
          cp data/latest.json data/index.json _site/data/
          [ -d data/history ] && cp -r data/history _site/data/history || true

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: run-bot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
